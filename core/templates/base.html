{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% if page %}{{ page.seo_title|default:page.title }} — {% endif %}A Forest of Rabbits{% endblock %}</title>

  <!-- Alice: display serif for headings, matched from the old Forest of Rabbits site -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">

  <!-- Compiled Tailwind CSS (build: .venv/bin/tailwindcss -i core/css/input.css -o core/static/css/output.css --minify) -->
  <link rel="stylesheet" href="{% static 'css/output.css' %}">

  <!-- Alpine.js CDN — pinned with SRI so an upstream release can't change or
       inject code into the live site; bump the version and hash together. -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js"
          integrity="sha384-FYLKjwG3aohNhNZoVG8sY/5ntunm+MqylL90Q+rT3OM7AwV9/BKFjk/RjoIpIgsI"
          crossorigin="anonymous"></script>

  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col bg-white text-gray-900">

  {% include 'includes/nav.html' %}

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  {% include 'includes/footer.html' %}

  <!-- HTMX CDN — pinned with SRI (see Alpine note above) -->
  <script src="https://unpkg.com/htmx.org@2.0.11/dist/htmx.min.js"
          integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
          crossorigin="anonymous"></script>

</body>
</html>
