{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}A Forest of Rabbits{% endblock %}</title>

  <!-- Alice: display serif for headings, matched from the old Forest of Rabbits site -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">

  <!-- Compiled Tailwind CSS (build: .venv/bin/tailwindcss -i core/css/input.css -o core/static/css/output.css --minify) -->
  <link rel="stylesheet" href="{% static 'css/output.css' %}">

  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col bg-white text-gray-900">

  {% include 'includes/nav.html' %}

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  {% include 'includes/footer.html' %}

  <!-- HTMX CDN -->
  <script src="https://unpkg.com/htmx.org@2.x"></script>

</body>
</html>
