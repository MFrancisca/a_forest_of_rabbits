{% load static nav_tags %}
{% nav_links as links %}
<!-- Add logo.png to core/static/img/ to display the logo -->
<nav aria-label="Main" class="bg-white border-b border-gray-200 px-4 py-3" x-data="{ open: false }">
  <div class="max-w-6xl mx-auto flex justify-between items-center">

    <!-- Logo (left) -->
    <a href="/" class="flex items-center gap-2">
      <img src="{% static 'img/logo.png' %}" alt="A Forest of Rabbits" class="h-10 w-auto" onerror="this.style.display='none'">
      <span class="font-semibold text-gray-800 text-lg">A Forest of Rabbits</span>
    </a>

    <!-- Desktop nav links (right, hidden on mobile) -->
    <ul class="hidden md:flex gap-6 items-center text-sm font-medium text-gray-600">
      {% for link in links %}
      <li><a href="{{ link.href }}"{{ link.current }} class="hover:text-accent transition-colors">{{ link.label }}</a></li>
      {% endfor %}
    </ul>

    <!-- Hamburger button (mobile only) -->
    <button type="button"
            class="md:hidden p-2 rounded text-gray-600 hover:text-accent hover:bg-gray-100 transition-colors"
            @click="open = !open"
            aria-label="Toggle navigation menu"
            aria-controls="mobile-menu"
            aria-expanded="false"
            :aria-expanded="open.toString()">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

  </div>

  <!-- Mobile menu (shown/hidden via Alpine.js) -->
  <div id="mobile-menu" x-show="open" x-cloak class="md:hidden mt-3 border-t border-gray-100 pt-3">
    <ul class="flex flex-col gap-1 text-sm font-medium text-gray-600 px-2">
      {% for link in links %}
      <li><a href="{{ link.href }}"{{ link.current }} class="block py-2 px-3 rounded hover:bg-gray-50 hover:text-accent transition-colors">{{ link.label }}</a></li>
      {% endfor %}
    </ul>
  </div>

</nav>
