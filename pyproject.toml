[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=pigments --cov=core --cov=blog --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["pigments", "core", "blog"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "*/factories.py",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
