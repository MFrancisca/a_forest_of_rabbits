[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# --ds outranks a DJANGO_SETTINGS_MODULE env var (the web container exports
# config.settings.dev, which would otherwise run tests against the dev Postgres
# and write factory images into the real media/ dir). Pass --ds again to override.
addopts = "--ds=config.settings.test --cov=pigments --cov=core --cov=blog --cov=journal --cov-report=term-missing --cov-fail-under=80 -m 'not a11y'"
# The axe-core browser checks are opt-in (they need Chromium): .venv/bin/pytest -m a11y --no-cov.
# A -m on the command line replaces the one in addopts.
markers = [
    "a11y: axe-core accessibility checks in headless Chromium (opt-in: pytest -m a11y --no-cov)",
]

[tool.coverage.run]
source = ["pigments", "core", "blog", "journal"]
omit = [
    "*/migrations/*",
    "*/migrations_*/*",
    "*/tests/*",
    "manage.py",
    "*/factories.py",
    "*/conftest.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
