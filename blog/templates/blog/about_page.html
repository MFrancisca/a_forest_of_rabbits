{% extends "base.html" %}
{% load wagtailcore_tags wagtailimages_tags %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-gray-900 mb-8">{{ page.title }}</h1>

  <div class="md:flex md:gap-8">
    {% if page.profile_photo %}
    <div class="md:w-1/3 mb-6 md:mb-0 flex-shrink-0">
      {% image page.profile_photo fill-400x400 as photo %}
      <img src="{{ photo.url }}" alt="{{ photo.alt }}" class="rounded-lg w-full">
    </div>
    {% endif %}
    <div class="md:flex-1">
      <div class="prose prose-gray max-w-none">
        {{ page.body|richtext }}
      </div>
    </div>
  </div>
</div>
{% endblock %}
